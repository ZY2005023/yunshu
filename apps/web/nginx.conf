# =============================================================================
# 宁渡课堂 · 前端 nginx 配置
#
# 职责：托管 SPA 静态文件 + 反代后端 /api 与 /files。
# 这样浏览器只需访问一个源，不用再处理跨域，也不用配 VITE_FILE_BASE_URL。
# =============================================================================

upstream ningdu_backend {
    # 对应 docker-compose 里的服务名
    server backend:1236;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传大小与后端 file.max-size / multipart 配置对齐
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------- 静态资源：带 hash 的文件可以长期缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 单页应用路由回退 ----------
    # 刷新 /knowledge/article/xxx 这类前端路由时，要回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 流式对话（SSE）----------
    # 这条必须放在 /api/ 之前，否则会被通用规则吃掉缓冲设置。
    # SSE 场景下 nginx 默认的响应缓冲会把流攒着一起发，前端就看不到"打字机"效果甚至超时。
    location /api/psychological-chat/stream {
        proxy_pass         http://ningdu_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 关闭 keep-alive 复用，避免连接被复用到非流式请求
        proxy_set_header Connection        '';

        proxy_buffering    off;
        proxy_cache        off;
        proxy_request_buffering off;

        # AI 生成可能较慢，读超时给足
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 其余接口 ----------
    location /api/ {
        proxy_pass         http://ningdu_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # ---------- 上传文件（后端 /files/** 静态映射）----------
    location /files/ {
        proxy_pass       http://ningdu_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 7d;
        add_header Cache-Control "public";
    }

    # 不对外暴露 nginx 版本号
    server_tokens off;
}
