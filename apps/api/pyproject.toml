[project]
name = "yunshu-api"
version = "0.1.0"
description = "云舒 · AI 心理健康助手 后端服务"
requires-python = ">=3.12"

# 接口契约与兼容约定见 README 第五节
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pymysql>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "openai>=1.60",
    # 知识库文档导入解析（services/doc_import.py，延迟导入 —— 不用该功能不加载）
    "python-docx>=1.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 项目名 yunshu-api 与代码目录 app 不同名，必须显式指定包位置，
# 否则 hatchling 无法推断要打包哪些文件（pip install -e . 会失败）
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
