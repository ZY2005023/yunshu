# Alembic configuration
#
# NOTE: sqlalchemy.url is intentionally left EMPTY here.
# The real connection string is read from environment variables
# (see alembic/env.py) so that secrets never land in version control.
#
# Keep this file ASCII-only: Alembic reads it with the platform default
# encoding, which is GBK on Chinese Windows and will choke on UTF-8 text.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
