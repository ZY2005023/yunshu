# 生产反向代理
#
# 三个必须记住的点：
#   1. SSE 流必须关 proxy_buffering，否则流式回复会被缓冲成一坨一次性吐出，
#      打字机效果直接消失。
#   2. /files 与静态资源转发给后端，前后端同源时其实可以不走 nginx。
#   3. ★ 必须走 HTTPS。学生在这里写的是心理状况，属最高敏感级个人信息，
#      明文传输过不了任何合规审查。80 端口只做跳转。
#
# 证书：把 fullchain.pem / privkey.pem 放到 ./certs/ 并在 compose 里挂到
#       /etc/nginx/certs/（只读）。内网没有正式证书时可自签：
#       openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#         -keyout certs/privkey.pem -out certs/fullchain.pem -subj "/CN=你的域名"
#       自签会让浏览器告警，仅适合内网试用；对外服务请用正式证书。

upstream ningdu_api {
    server api:1236;
}

# ---------------------------------------------------------------------------
# 80：只做跳转，不承载业务
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Let's Encrypt 的 HTTP-01 校验要走这个路径，别把它一起跳走
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443：正式服务
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;

    # ★ HSTS：告诉浏览器以后只走 HTTPS。
    #   注意一旦下发，在 max-age 内无法回退到 HTTP —— 确认证书能持续续期再开。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # 接口文档：默认匿名可见，会把全部接口清单暴露出去。
    # 生产只放行内网网段，示例按需改成你们实际的段。
    location ~ ^/(docs|redoc|openapi.json) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://ningdu_api;
    }

    # 前端静态资源
    location /assets/ {
        proxy_pass http://ningdu_api;
        expires 7d;
    }

    # 上传文件（匿名可访问：<img> 带不了 Authorization 头）
    location /files/ {
        proxy_pass http://ningdu_api;
        expires 30d;
    }

    # API
    location /api/ {
        proxy_pass http://ningdu_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ SSE 流式对话：必须关缓冲，且读超时要够长（AI 回复可能几十秒）
    location /api/psychological-chat/stream {
        proxy_pass http://ningdu_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA 兜底
    location / {
        proxy_pass http://ningdu_api;
    }
}
